<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre-save — Gentle &amp; Lowly</title>
  <!--
    Portable vanity redirect: /presave → DistroKid HyperFollow.
    Works on ANY static host (including plain file hosting & GitHub Pages).
    On Vercel/Netlify the platform config issues a faster server-side 308
    before this file is ever served; this is the universal fallback.
    ▸ To change the destination, update the URL in THREE places:
      1) this file (meta refresh + the <a> + the script)
      2) ../vercel.json
      3) ../_redirects
  -->
  <meta http-equiv="refresh" content="0; url=https://distrokid.com/hyperfollow/gentleandlowly/your-son-before-me?ref=release" />
  <link rel="canonical" href="https://distrokid.com/hyperfollow/gentleandlowly/your-son-before-me?ref=release" />
  <meta name="robots" content="noindex" />
  <style>
    html,body{height:100%;margin:0}
    body{background:#1a1714;color:#f5ead6;font-family:'Source Sans 3',system-ui,sans-serif;
         display:grid;place-items:center;text-align:center;padding:2rem}
    .amp{color:#c4793a;font-weight:700}
    p{letter-spacing:.06em;opacity:.7;font-weight:300}
    a{color:#d97757}
    .mark{font-weight:200;letter-spacing:.3em;text-transform:uppercase;font-size:.85rem;margin-bottom:1.2rem;opacity:.85}
  </style>
</head>
<body>
  <div>
    <div class="mark">GENTLE <span class="amp">&amp;</span> LOWLY</div>
    <p>Taking you to the pre-save&hellip;<br />
      If nothing happens,
      <a href="https://distrokid.com/hyperfollow/gentleandlowly/your-son-before-me?ref=release">tap here</a>.
    </p>
  </div>
  <script>
    location.replace("https://distrokid.com/hyperfollow/gentleandlowly/your-son-before-me?ref=release");
  </script>
</body>
</html>
